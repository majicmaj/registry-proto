syntax = "proto3";

package buf.registry.search.v1beta1;

import "buf/registry/module/v1/resource.proto";
import "buf/registry/priv/extension/v1beta1/extension.proto";
import "buf/validate/validate.proto";

option go_package = "buf.build/gen/go/bufbuild/registry/protocolbuffers/go/buf/registry/search/v1beta1";

// The kind of a Symbol.
//
// With the exception of SYMBOL_KIND_PACKAGE, each kind corresponds to a descriptor
// within a FileDescriptorSet.
enum SymbolKind {
  SYMBOL_KIND_UNSPECIFIED = 0;
  // A package, e.g. "acme.pet.v1".
  SYMBOL_KIND_PACKAGE = 1;
  // A file, e.g. "acme/pet/v1/pet.proto".
  SYMBOL_KIND_FILE = 2;
  // A message.
  SYMBOL_KIND_MESSAGE = 3;
  // An enum.
  SYMBOL_KIND_ENUM = 4;
  // A value of an enum.
  SYMBOL_KIND_ENUM_VALUE = 5;
  // A service.
  SYMBOL_KIND_SERVICE = 6;
  // A method of a service.
  SYMBOL_KIND_METHOD = 7;
  // A field of a message.
  SYMBOL_KIND_FIELD = 8;
  // A oneof of a message.
  SYMBOL_KIND_ONEOF = 9;
  // An extension.
  SYMBOL_KIND_EXTENSION = 10;
}

// The kind of reference one Symbol makes to another.
enum ReferenceKind {
  REFERENCE_KIND_UNSPECIFIED = 0;
  // A field whose type is the referenced message or enum.
  REFERENCE_KIND_FIELD_TYPE = 1;
  // A method whose input type is the referenced message.
  REFERENCE_KIND_METHOD_INPUT = 2;
  // A method whose output type is the referenced message.
  REFERENCE_KIND_METHOD_OUTPUT = 3;
  // An extension that extends the referenced message.
  REFERENCE_KIND_EXTENDS = 4;
}

// A Symbol within the schema of a Commit.
//
// A Symbol is an addressable element of a Protobuf schema, such as a message, enum,
// service, method, or field. It is pinned to the Commit it was found in.
message Symbol {
  option (buf.registry.priv.extension.v1beta1.message).response_only = true;

  // The fully-qualified name of the Symbol, e.g. "acme.pet.v1.PetStoreService.GetPet".
  string fully_qualified_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "fqn_no_period_prefix"
      message: "fully-qualified names should not start with a '.'"
      expression: "!this.startsWith('.')"
    }
  ];
  // The kind of the Symbol.
  SymbolKind kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The name of the User or Organization that owns the Module containing the Symbol.
  string owner = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 32
  ];
  // The name of the Module containing the Symbol.
  string module = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 2
      max_len: 100
    }
  ];
  // The id of the Commit the Symbol was found in.
  string commit_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.tuuid = true
  ];
  // The name of the Label that resolved to the Commit, if the request scoped the search
  // to a Label.
  string label_name = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 250
  ];
  // The path of the file that defines the Symbol, e.g. "acme/pet/v1/pet.proto".
  //
  // This is also the path to import to use the Symbol.
  string file_path = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 4096
      not_contains: "\\"
    }
  ];
  // Whether the Symbol is deprecated.
  bool deprecated = 8;
  // The dependency to add to a buf.yaml to use the Symbol from another Module, e.g.
  // "buf.build/acme/petapis".
  //
  // Empty if no dependency is needed, for example for a Well-Known Type.
  string dependency = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 256
  ];
}

// A reference to a Symbol.
//
// The Symbol is addressed by its fully-qualified name within the Module, Label, or
// Commit referenced by resource_ref.
//
// SymbolRefs can only be used in requests, and only for read-only RPCs.
message SymbolRef {
  option (buf.registry.priv.extension.v1beta1.message).request_only = true;
  option (buf.registry.priv.extension.v1beta1.message).no_side_effects_only = true;

  // The Module, Label, or Commit that contains the Symbol.
  buf.registry.module.v1.ResourceRef resource_ref = 1 [(buf.validate.field).required = true];
  // The fully-qualified name of the Symbol.
  string fully_qualified_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "fqn_no_period_prefix"
      message: "fully-qualified names should not start with a '.'"
      expression: "!this.startsWith('.')"
    }
  ];
}
